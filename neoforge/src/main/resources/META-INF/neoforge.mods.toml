modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

# 必需：NeoForge 与 Minecraft
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# 必选：车万女仆（界面贴图、女仆饰品判定、容器与任务 API 均来自 TLM）
[[dependencies.${mod_id}]]
modId = "touhou_little_maid"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# 可选：Jade（准心信息面板）。未安装时 Jade 相关功能缺席，其余功能正常。
[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# 可选：Curios（女仆侧 Curios 兼容按钮）。未安装时按钮不出现。
[[dependencies.${mod_id}]]
modId = "curios"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
