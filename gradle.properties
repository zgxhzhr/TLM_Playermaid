# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=1.0.0
group=io.github.zgxhzhr
java_version=21

# Common
minecraft_version=1.21.1
mod_name=\u4eba\u662f\u72d0
mod_author=\u9010\u5149\u661f\u706b_\u6267\u706b\u4eba
mod_id=playermaid
license=MIT
credits=
description=\u5c06\u73a9\u5bb6\u53d8\u6210\u5973\u4ec6\uff1a\u5973\u4ec6\u6837\u5f0f\u80cc\u5305\u4e0e\u9970\u54c1\u754c\u9762\u3001Jade \u5973\u4ec6\u4fe1\u606f\u9762\u677f\u3001\u81ea\u5b9a\u4e49\u5934\u9876\u6e32\u67d3\u540d\u3002
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric / Forge：本工程不构建这两个加载器，字段保留供 buildSrc 的 expandProps 展开
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9
forge_version=52.0.28
forge_loader_version_range=[52,)

# NeoForge：与编译期依赖 TLM 1.21.1（touhoulittlemaid-1.5.3-neoforge+mc1.21.1）的构建版本对齐
neoforge_version=21.1.219
neoforge_loader_version_range=[4,)

# 编译期第三方依赖 jar（仅编译期符号，不打包，运行期由整合包提供）
# 车万女仆：硬依赖（GUI 贴图、女仆饰品判定、容器/任务 API）
tlm_jar_path=libs/touhoulittlemaid-1.21.1-neoforge.jar
# Jade：软依赖（准心女仆信息面板、模组名行；缺席时相关 Mixin/插件不加载）
jade_jar_path=libs/Jade-1.21.1-neoforge.jar
# Curios：软依赖（女仆侧 Curios 兼容按钮）
curios_jar_path=libs/curios-neoforge-9.2.0+1.21.1.jar

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ========== Gradle JDK 白名单（java_version=21，统一用 JDK21 编译与运行 Gradle） ==========
# 系统默认 Java 25 会导致 buildSrc Groovy 编译失败（Unsupported class file major version 69）
org.gradle.java.home=C\:\\Program Files\\Java\\jdk-21.0.12
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=C\:\\Program Files\\Java\\jdk-17,C\:\\Program Files\\Java\\jdk-21.0.12,C\:\\Users\\MKIII\\.jdks\\ms-21.0.11

# ========== 依赖下载代理（本机 git/浏览器同一代理） ==========
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=10808
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=10808
systemProp.http.nonProxyHosts=localhost|127.0.0.1
